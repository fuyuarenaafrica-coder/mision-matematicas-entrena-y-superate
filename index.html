<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrenamiento matemático · SA1</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#17283a;background:#fff}*{box-sizing:border-box}body{margin:0}header{border-bottom:4px solid #25a5c9;padding:20px max(18px,calc((100vw - 1050px)/2))}h1{font-size:clamp(23px,3vw,32px);margin:0 0 6px}header p{margin:0;color:#506275}main{max-width:1050px;margin:22px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.tile{background:#fff;border:2px solid #d3e4ec;border-radius:12px;padding:19px;text-align:left;cursor:pointer;min-height:132px}.tile:hover,.tile:focus{border-color:#147fa8;background:#f1fbff}.tile strong{display:block;font-size:18px;margin:7px 0}.small{font-size:13px;color:#546779}.tag{color:#086b90;font-size:13px;font-weight:bold}.panel{border:2px solid #dce9ee;border-radius:14px;padding:22px;background:white}.bar{height:11px;background:#e6f0f5;border-radius:10px;overflow:hidden;margin:14px 0}.fill{height:100%;background:#1685ae;width:0;transition:width .2s}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn{background:#096c96;color:white;border:0;border-radius:9px;padding:12px 18px;font-size:16px;font-weight:bold;cursor:pointer}.btn.secondary{background:#e8f3f7;color:#15516b}.btn:disabled{opacity:.45;cursor:default}.prompt{font-size:clamp(20px,2.8vw,27px);font-weight:bold;line-height:1.5;margin:20px 0 14px}.answer{font-size:23px;padding:12px;border:2px solid #a6c7d6;border-radius:9px;max-width:280px;width:100%}.choices{display:flex;flex-wrap:wrap;gap:10px}.choice{padding:12px 18px;border:2px solid #9dc9d9;border-radius:9px;background:#fff;font-size:17px;cursor:pointer}.choice.selected{background:#d6eff8;border-color:#126f95}.feedback{padding:13px;border-radius:9px;margin:16px 0;min-height:50px;background:#f2f7fa}.feedback.good{background:#e9f8ed;color:#195c2e}.feedback.bad{background:#fff3e4;color:#70450b}.hint{background:#f1f8fc;border-left:4px solid #1685ae;padding:13px;margin:14px 0}.step{color:#136b8f;font-weight:bold}.division{display:flex;gap:25px;align-items:flex-start;flex-wrap:wrap;margin:15px 0}.longdiv{font-family:monospace;font-size:28px;white-space:pre;line-height:1.45;background:#fff;padding:15px;border:2px solid #d6e7ee;border-radius:9px;min-width:185px}.times{border:1px solid #bfdce8;background:#f5fbfe;padding:12px 20px;border-radius:9px;line-height:1.7;min-width:135px}.times strong{display:block;margin-bottom:5px}.muted{color:#566a79}.summary{font-size:20px;line-height:1.8}footer{max-width:1050px;margin:20px auto;padding:10px 16px;color:#6b7884;font-size:12px}button:focus-visible,input:focus-visible{outline:3px solid #f3a62b;outline-offset:2px}@media(max-width:550px){.panel{padding:14px}.longdiv{font-size:23px}.division{gap:12px}}</style></head><body><header><h1>Entrenamiento matemático · SA1</h1><p>Elige un bloque, observa el ejemplo y practica a tu ritmo.</p></header><main id="app"></main><footer>Repaso adaptado de SA1 · Sentido numérico. Los resultados se guardan únicamente en este navegador.</footer><script>
'use strict';const defs=[['Multiplicaciones repetidas',20],['Cuadrados de números',20],['Operaciones combinadas',30],['Divisores de un número',25],['Múltiplos de un número',25],['¿Divisor o múltiplo?',25],['Divisiones exactas y no exactas',30],['Problemas matemáticos',25]];
const examples=[['3 + 3 + 3 = 3 × 3 = 9','Cuenta cuántas veces se repite el número.'],['4 × 4 = 16','Un cuadrado se obtiene multiplicando un número por sí mismo.'],['(6 + 4) × 2 = 10 × 2 = 20','Primero paréntesis; después multiplicaciones y divisiones; al final sumas y restas.'],['12 ÷ 3 = 4, resto 0','3 es divisor de 12 porque la división es exacta.'],['4 × 1 = 4; 4 × 2 = 8; 4 × 3 = 12','Los múltiplos se obtienen multiplicando por 1, 2, 3…'],['3 es divisor de 12. 12 es múltiplo de 3.','Para comprobarlo: 12 ÷ 3 = 4, resto 0.'],['17 ÷ 3 = 5, resto 2','División exacta: resto 0. No exacta: resto distinto de 0.'],['4 paquetes de 3 galletas y 6 sueltas: 4 × 3 + 6 = 18','Lee, elige la operación y escribe el resultado.']];
const $=s=>document.querySelector(s),app=$('#app');let block=-1,index=0,correct=0,attempts=0,selected='',current=null,items=[],divState=null;let store={};try{store=JSON.parse(localStorage.getItem('sa1_practica_v1')||'{}')}catch(e){}function save(){try{localStorage.setItem('sa1_practica_v1',JSON.stringify(store))}catch(e){}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function rand(a,b){return a+Math.floor(Math.random()*(b-a+1))}function pick(a){return a[rand(0,a.length-1)]}function fmt(n){return String(n)}
function make(b,i){let a,c,d,r,kind=i%5;switch(b){case 0:a=rand(2,8);c=rand(2,5);if(kind===0)return{q:`Convierte en multiplicación: ${Array(c).fill(a).join(' + ')}`,ans:`${c} × ${a}`,type:'text',hint:`El ${a} se repite ${c} veces. Escribe: ${c} × ${a}.`,accept:[`${c}x${a}`,`${c}*${a}`,`${c} × ${a}`]};if(kind===1)return{q:`Calcula: ${Array(c).fill(a).join(' + ')} = ?`,ans:c*a,hint:`Multiplica ${c} × ${a}.`};if(kind===2)return{q:`Completa: ${a} × ___ = ${a*c}`,ans:c,hint:`Busca ${a} × ? = ${a*c}.`};if(kind===3)return{q:`¿Qué multiplicación repite el mismo número?`,choices:[`${a} × ${a}`,`${a} × ${a+1}`,`${a} × ${a+2}`],ans:`${a} × ${a}`,hint:'Los dos factores tienen que ser iguales.'};return{q:`Calcula: ${a} × ${c} = ?`,ans:a*c,hint:`Puedes sumar ${a} un total de ${c} veces.`};
case 1:a=rand(1,10);if(kind===0)return{q:`Calcula el cuadrado de ${a}: ${a} × ${a} = ?`,ans:a*a,hint:`Multiplica ${a} por sí mismo.`};if(kind===1)return{q:`Completa: ___ × ${a} = ${a*a}`,ans:a,hint:'Los dos números son iguales.'};if(kind===2)return{q:`¿Cuál es el cuadrado de ${a}?`,ans:a*a,hint:`${a} × ${a}`};if(kind===3)return{q:`Un cuadrado tiene ${a} filas y ${a} columnas. ¿Cuántas casillas hay?`,ans:a*a,hint:`${a} × ${a}`};return{q:`Elige la multiplicación que forma un cuadrado.`,choices:[`${a} × ${a+1}`,`${a} × ${a}`,`${a} × ${a+2}`],ans:`${a} × ${a}`,hint:'Busca dos factores iguales.'};
case 2:a=rand(3,16);c=rand(2,7);d=rand(2,5);if(kind===0)return{q:`${a} + ${c} − ${d} = ?`,ans:a+c-d,hint:`Primero ${a} + ${c}; después resta ${d}.`};if(kind===1)return{q:`${c} × ${d} + ${a} = ?`,ans:c*d+a,hint:`Primero ${c} × ${d}; después suma ${a}.`};if(kind===2)return{q:`(${a} + ${c}) × ${d} = ?`,ans:(a+c)*d,hint:`Primero el paréntesis: ${a}+${c}.`};if(kind===3)return{q:`${c} × ${d} − ${a%8+1} = ?`,ans:c*d-(a%8+1),hint:'Primero la multiplicación; después la resta.'};return{q:`(${a} − ${c}) × ${d} = ?`,ans:(a-c)*d,hint:'Resuelve primero el paréntesis.'};
case 3:a=pick([8,10,12,15,18,20,24,30,36]);c=rand(2,10);if(kind===0)return{q:`¿${c} es divisor de ${a}?`,choices:['Sí','No'],ans:a%c===0?'Sí':'No',hint:`Divide ${a} entre ${c}. Si el resto es 0, sí es divisor.`};if(kind===1){d=pick([2,3,4,5,6]);return{q:`¿${d} es divisor de ${a}?`,choices:['Sí','No'],ans:a%d===0?'Sí':'No',hint:`Comprueba si ${a} ÷ ${d} tiene resto 0.`}}if(kind===2)return{q:`Completa: ${a} ÷ ${c} tiene resto...`,ans:a%c,hint:`Busca el múltiplo de ${c} más cercano a ${a} sin pasarte.`};if(kind===3)return{q:`¿El número 1 es divisor de ${a}?`,choices:['Sí','No'],ans:'Sí',hint:'Todos los números naturales se pueden dividir exactamente entre 1.'};return{q:`¿${a} es divisible entre ${c}?`,choices:['Sí','No'],ans:a%c===0?'Sí':'No',hint:'Comprueba el resto de la división.'};
case 4:a=rand(2,10);c=rand(1,9);if(kind===0)return{q:`Escribe el ${c}.º múltiplo de ${a} (empezando por ${a} × 1).`,ans:a*c,hint:`${a} × ${c}`};if(kind===1)return{q:`Completa: ${a} × ___ = ${a*c}`,ans:c,hint:`Busca qué número multiplicado por ${a} da ${a*c}.`};if(kind===2)return{q:`¿${a*c} es múltiplo de ${a}?`,choices:['Sí','No'],ans:'Sí',hint:`${a} × ${c} = ${a*c}.`};if(kind===3)return{q:`¿${a*c+1} es múltiplo de ${a}?`,choices:['Sí','No'],ans:'No',hint:'Comprueba si aparece en la tabla de multiplicar.'};return{q:`¿Cuál es el siguiente múltiplo después de ${a*c} en la tabla del ${a}?`,ans:a*(c+1),hint:`Suma ${a} a ${a*c}.`};
case 5:a=rand(2,9);c=rand(2,8);d=a*c; if(kind===0)return{q:`¿${a} es divisor de ${d}?`,choices:['Sí','No'],ans:'Sí',hint:`${d} ÷ ${a} = ${c}, resto 0.`};if(kind===1)return{q:`¿${d} es múltiplo de ${a}?`,choices:['Sí','No'],ans:'Sí',hint:`${a} × ${c} = ${d}.`};if(kind===2)return{q:`¿${a} es múltiplo de ${d}?`,choices:['Sí','No'],ans:'No',hint:`${a} es menor que ${d}.`};if(kind===3)return{q:`¿${a+1} es divisor de ${d}?`,choices:['Sí','No'],ans:d%(a+1)===0?'Sí':'No',hint:`Divide ${d} entre ${a+1} y comprueba el resto.`};return{q:`Completa: ${d} es ______ de ${a}.`,choices:['múltiplo','divisor'],ans:'múltiplo',hint:`${d} se obtiene multiplicando ${a} × ${c}.`};
case 6:a=rand(2,10);c=rand(2,12);r=kind===0||kind===2?0:rand(1,a-1);d=a*c+r;return{q:`${d} ÷ ${a}`,ans:c,dividend:d,divisor:a,remainder:r,hint:`Busca ${a} × ${c} = ${a*c}; de ${a*c} para llegar a ${d} faltan ${r}.`,type:'division'};
case 7:a=rand(2,8);c=rand(2,7);d=rand(1,9);if(kind===0)return{q:`Hay ${a} cajas con ${c} cuadernos en cada una. ¿Cuántos cuadernos hay?`,ans:a*c,hint:`Multiplica ${a} × ${c}.`};if(kind===1)return{q:`Hay ${a} paquetes de ${c} galletas y ${d} galletas sueltas. ¿Cuántas hay?`,ans:a*c+d,hint:`Primero ${a} × ${c}; después suma ${d}.`};if(kind===2)return{q:`Hay ${a*c} caramelos para repartir entre ${a} niños. ¿Cuántos recibe cada uno?`,ans:c,hint:`Divide ${a*c} entre ${a}.`};if(kind===3)return{q:`Una sala tiene ${a} filas con ${c} sillas cada una. ¿Cuántas sillas hay?`,ans:a*c,hint:`${a} × ${c}.`};return{q:`Hay ${a} grupos de ${c} alumnos y ${d} profesores. ¿Cuántas personas van?`,ans:a*c+d,hint:`${a} × ${c} + ${d}.`};}}
function home(){block=-1;let tiles=defs.map(([name,count],i)=>{let p=store[i];return `<button class="tile" data-b="${i}"><span class="tag">BLOQUE ${i+1}</span><strong>${esc(name)}</strong><span class="small">${count} ejercicios · ${p?`Última sesión: ${p.score}/${p.total} aciertos`:'Sin empezar'}</span></button>`}).join('');app.innerHTML=`<h2>Elige qué quieres repasar</h2><p class="muted">Puedes practicar los bloques en cualquier orden.</p><div class="grid">${tiles}</div>`;document.querySelectorAll('[data-b]').forEach(el=>el.onclick=()=>start(+el.dataset.b))}
function start(b){block=b;index=0;correct=0;attempts=0;items=Array.from({length:defs[b][1]},(_,i)=>make(b,i));render()}
function render(){current=items[index];selected='';divState=null;let isdiv=current.type==='division';let content=isdiv?divisionInit():`<div class="prompt">${esc(current.q)}</div>${current.choices?`<div class="choices">${current.choices.map(v=>`<button class="choice" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`:`<label for="answer" class="small">Escribe tu respuesta</label><div><input id="answer" class="answer" autocomplete="off" inputmode="${current.type==='text'?'text':'numeric'}" aria-label="Respuesta"></div>`}`;app.innerHTML=`<div class="top"><button class="btn secondary" id="back">← Bloques</button><span class="small">Bloque ${block+1} · ${index+1} de ${items.length} · Aciertos: ${correct}</span></div><div class="bar"><div class="fill" style="width:${100*index/items.length}%"></div></div><section class="panel"><h2>${esc(defs[block][0])}</h2>${index===0?`<div class="hint"><b>Ejemplo:</b> ${esc(examples[block][0])}<br><span class="small">${esc(examples[block][1])}</span></div>`:''}${content}<div class="feedback" id="feedback" role="status">Resuelve el ejercicio. Puedes consultar una pista.</div><div class="top"><button class="btn secondary" id="hint">Ver pista</button><div><button class="btn" id="check">Comprobar</button> <button class="btn secondary" id="next" style="display:none">Siguiente →</button></div></div></section>`;$('#back').onclick=home;$('#hint').onclick=()=>{$('#feedback').className='feedback';$('#feedback').textContent=current.hint};$('#check').onclick=check;$('#next').onclick=next;document.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{selected=el.dataset.v;document.querySelectorAll('.choice').forEach(e=>e.classList.toggle('selected',e===el))});if($('#answer')){$('#answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});$('#answer').focus()}}
function divisionInit(){let n=current.dividend,d=current.divisor;divState={stage:0,digits:String(n),pos:0,take:0,quot:'',remainder:0,lines:[],done:false};let digits=String(n);let pos=0,take=0;while(pos<digits.length&&take<d){take=take*10+ +digits[pos++]}divState.pos=pos;divState.take=take;divState.stages=[];while(true){let q=Math.floor(take/d),prod=q*d,rem=take-prod;divState.stages.push({take,q,prod,rem,pos});if(pos>=digits.length)break;take=rem*10+ +digits[pos++]}divState.step=0;return `<div class="prompt">Resuelve ${n} ÷ ${d}, paso a paso</div><div class="division"><div><div class="longdiv" id="longdiv"></div><div class="small" id="divinstruction"></div></div><div class="times"><strong>Tabla del ${d}</strong>${Array.from({length:10},(_,i)=>`${d} × ${i+1} = ${d*(i+1)}`).join('<br>')}</div></div><label for="answer" class="small">Escribe el número que corresponde</label><div><input id="answer" class="answer" inputmode="numeric" autocomplete="off" aria-label="Respuesta de este paso"></div>`}
function divStepInfo(){let s=divState.stages[Math.floor(divState.step/4)];let sub=divState.step%4,d=current.divisor;let expected,txt;if(sub===0){expected=s.q;txt=`DIVIDO: ${s.take} entre ${d} es igual a… Escribe el resultado en el cociente.`}else if(sub===1){expected=s.prod;txt=`MULTIPLICO: ${s.q} × ${d} es igual a… Escribe el resultado debajo.`}else if(sub===2){expected=s.rem;txt=`CALCULO LO QUE FALTA: de ${s.prod} para llegar a ${s.take}, ¿cuánto falta?`}else{expected=divState.stages[Math.floor(divState.step/4)+1].take;txt=`BAJO la siguiente cifra. Ahora tengo…`}return{expected,txt,s,sub}}
function drawDiv(){let ds=divState,info=divStepInfo(),s=info.s;let q=ds.stages.map((x,i)=>Math.floor(ds.step/4)>i||Math.floor(ds.step/4)===i&&ds.step%4>0?x.q:'·').join('');let lines=[`${current.dividend} │ ${current.divisor}`,` ${' '.repeat(String(current.dividend).length)}└────`,` ${' '.repeat(String(current.dividend).length)}  ${q}`];for(let i=0;i<ds.stages.length;i++){let st=ds.stages[i],base=i*4;if(ds.step>base+1)lines.push(`${st.prod}  (multiplico)`);if(ds.step>base+2)lines.push(`${st.rem}  (falta)`);if(ds.step>base+3&&i<ds.stages.length-1)lines.push(`${ds.stages[i+1].take}  (bajo)`)}$('#longdiv').textContent=lines.join('\n');$('#divinstruction').textContent=info.txt;$('#feedback').textContent='Sigue la instrucción y escribe el número.'}
function check(){if($('#check').disabled)return;let val=current.choices?selected:($('#answer')?.value||'').trim();if(!val){$('#feedback').textContent='Escribe o selecciona una respuesta.';return}attempts++;let ok;if(current.type==='division'){let info=divStepInfo();ok=Number(val)===info.expected;if(ok){divState.step++;$('#answer').value='';if(divState.step===divState.stages.length*4-1){let last=divState.stages.at(-1);$('#feedback').className='feedback good';$('#feedback').textContent=`Correcto. Cociente ${Math.floor(current.dividend/current.divisor)}, resto ${current.remainder}. ${current.remainder===0?'División exacta.':'División no exacta.'}`;correct++;$('#check').disabled=true;$('#next').style.display='inline-block';return}if(divState.step%4===3&&divState.step+1===divState.stages.length*4){divState.step++;}drawDiv();$('#feedback').className='feedback good';$('#feedback').textContent='Correcto. Continúa con el siguiente paso.';return}}else if(current.type==='text'){let normalized=x=>String(x).toLowerCase().replace(/\s+/g,'').replace(/×|\*/g,'x');ok=(current.accept||[current.ans]).some(a=>normalized(a)===normalized(val))}else ok=String(val).trim()===String(current.ans);if(ok){correct++;$('#feedback').className='feedback good';$('#feedback').textContent='Correcto. Puedes continuar.';$('#check').disabled=true;$('#next').style.display='inline-block'}else{$('#feedback').className='feedback bad';$('#feedback').textContent=`Todavía no. Pista: ${current.hint}`}}
function next(){index++;if(index>=items.length){store[block]={score:correct,total:items.length,date:new Date().toLocaleDateString('es-ES')};save();app.innerHTML=`<section class="panel"><h2>Bloque completado</h2><p class="summary">${esc(defs[block][0])}<br><strong>${correct} de ${items.length} ejercicios correctos</strong></p><p>Si necesitas practicar más, puedes repetir este bloque.</p><button class="btn" id="repeat">Repetir bloque</button> <button class="btn secondary" id="home">Elegir otro bloque</button></section>`;$('#repeat').onclick=()=>start(block);$('#home').onclick=home}else render()}
// Presentación vertical progresiva y repetición fija de las preguntas.
const oldRender=render;render=function(){oldRender();if(current.type==='division')drawDiv()};home();
</script></body></html>
